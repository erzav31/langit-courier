<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Langit Courier — Pesawat Kurir Kepulauan Langit</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #174a6b; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Dibaca, tidak ditampilkan: baris status untuk screen reader. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Langit Courier: terbangkan pesawat kurir Camar-7 melewati ring dan mendarat di Runway 07 Pulau Karang"></canvas>
<p id="status" role="status" aria-live="polite">Langit Courier sedang dimuat.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
